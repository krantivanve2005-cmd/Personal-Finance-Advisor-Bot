{% extends "base.html" %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <div class="sub">Log in to your FinAI account</div>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="priya@email.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="••••••••" required></div>
      <div style="text-align:right;font-size:12.5px;margin-bottom:14px;"><a href="#" style="color:var(--muted);">Forgot Password?</a></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Login</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-secondary" style="width:100%;justify-content:center;" disabled title="Google OAuth not configured in this demo">Continue with Google</button>
    <div class="switch-auth">New here? <a href="{{ url_for('auth.register') }}">Create an Account</a></div>
    <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;">Demo login: priya@email.com / password123 (after running seed.py)</p>
  </div>
</div>
{% endblock %}
