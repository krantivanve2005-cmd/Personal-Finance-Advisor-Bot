{% extends "base.html" %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <div class="sub">Start managing your finances with AI</div>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="field"><label>Full Name</label><input name="full_name" type="text" placeholder="Priya Sharma" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" placeholder="priya@email.com" required></div>
      <div class="row2">
        <div class="field"><label>Password</label><input name="password" type="password" placeholder="••••••••" required></div>
        <div class="field"><label>Confirm Password</label><input name="confirm_password" type="password" placeholder="••••••••" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>Monthly Income</label><input name="monthly_income" type="text" placeholder="60000"></div>
        <div class="field"><label>Financial Goal</label><input name="financial_goal" type="text" placeholder="Emergency fund"></div>
      </div>
      <label class="chk"><input type="checkbox" required style="margin-top:2px;"> I agree to the Terms and Privacy Policy.</label>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Create Account</button>
    </form>
    <div class="switch-auth">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></div>
  </div>
</div>
{% endblock %}
